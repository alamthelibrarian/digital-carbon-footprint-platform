name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Report dependency audit
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const a=require('./npm-audit.json'); const v=a.vulnerabilities||{}; console.log(JSON.stringify({summary:a.metadata?.vulnerabilities,details:Object.entries(v).map(([name,item])=>({name,severity:item.severity,range:item.range,fixAvailable:item.fixAvailable,via:item.via.map(x=>typeof x==='string'?x:{title:x.title,url:x.url,range:x.range})}))},null,2))"
      - name: Enforce high-severity dependency threshold
        run: npm audit --audit-level=high
      - name: Type-check TypeScript
        run: npm run typecheck
      - name: Run calculation tests
        run: npm test
      - name: Check and build
        run: npm run build
